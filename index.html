<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coin Toss Roguelike</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    #canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* UI Base */
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      font-size: 16px;
      color: #fff;
    }

    /* Stats Display */
    #game-info {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      gap: 15px;
      pointer-events: auto;
    }

    .stat-display {
      background: rgba(0, 0, 0, 0.8);
      border: 2px solid #0f0;
      padding: 10px 15px;
      border-radius: 6px;
      font-weight: bold;
      color: #0f0;
    }

    #status-text {
      position: absolute;
      top: 100px;
      right: 20px;
      background: rgba(0, 0, 0, 0.8);
      border: 2px solid #0f0;
      padding: 10px 15px;
      border-radius: 6px;
      color: #0f0;
      font-family: monospace;
      pointer-events: auto;
    }

    /* Skill Panel */
    #skill-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.95);
      border-top: 3px solid #0f0;
      padding: 20px;
      max-height: 35%;
      display: flex;
      flex-direction: column;
      pointer-events: auto;
      transform: translateY(0);
      transition: transform 0.3s ease;
    }

    #skill-panel.hidden {
      transform: translateY(120%);
      pointer-events: none;
    }

    #skill-panel h2 {
      color: #0f0;
      margin-bottom: 15px;
      text-shadow: 0 0 10px #0f0;
    }

    #skill-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      overflow-y: auto;
      max-height: 150px;
    }

    .skill-button {
      background: rgba(0, 100, 0, 0.5);
      border: 2px solid #0f0;
      color: #0f0;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
      font-weight: bold;
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 13px;
    }

    .skill-button:hover {
      background: rgba(0, 150, 0, 0.7);
      box-shadow: 0 0 15px #0f0;
    }

    .skill-icon {
      font-size: 1.8em;
    }

    .skill-name {
      font-weight: bold;
    }

    .skill-desc {
      font-size: 0.75em;
      color: #8f8;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Result Panel */
    #result-panel {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.95);
      border: 3px solid #0f0;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      display: none;
      pointer-events: auto;
      z-index: 100;
      min-width: 350px;
    }

    #result-panel.show {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    #result-panel h3 {
      color: #0f0;
      font-size: 1.5em;
      text-shadow: 0 0 10px #0f0;
    }

    #result-panel p {
      color: #8f8;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    #result-icon {
      font-size: 3em;
    }

    .result-button {
      background: #006600;
      border: 2px solid #0f0;
      color: #0f0;
      padding: 12px 30px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1em;
      transition: all 0.2s ease;
      pointer-events: auto;
      align-self: center;
    }

    .result-button:hover {
      background: #009900;
      box-shadow: 0 0 15px #0f0;
    }

    /* Title Screen */
    #title-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #001a00, #003300);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 200;
      pointer-events: auto;
    }

    #title-screen h1 {
      color: #0f0;
      font-size: 3em;
      margin-bottom: 20px;
      text-shadow: 0 0 20px #0f0;
    }

    #title-screen p {
      color: #8f8;
      font-size: 1.2em;
      margin-bottom: 40px;
      line-height: 1.6;
    }

    #start-button {
      background: #006600;
      border: 3px solid #0f0;
      color: #0f0;
      padding: 15px 50px;
      font-size: 1.3em;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s ease;
      pointer-events: auto;
    }

    #start-button:hover {
      background: #009900;
      box-shadow: 0 0 25px #0f0;
    }

    #title-screen.hidden {
      display: none;
    }

    /* Game Over Screen */
    #gameover-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 200;
      pointer-events: auto;
    }

    #gameover-screen.show {
      display: flex;
    }

    #gameover-screen h2 {
      color: #f66;
      font-size: 2.5em;
      margin-bottom: 30px;
      text-shadow: 0 0 15px #f66;
    }

    .stats-display {
      background: rgba(0, 100, 0, 0.3);
      border: 2px solid #0f0;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 30px;
      color: #8f8;
    }

    .stats-display p {
      font-size: 1.1em;
      margin: 10px 0;
    }

    #retry-button {
      background: #006600;
      border: 3px solid #0f0;
      color: #0f0;
      padding: 12px 40px;
      font-size: 1.1em;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s ease;
      pointer-events: auto;
    }

    #retry-button:hover {
      background: #009900;
      box-shadow: 0 0 20px #0f0;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="ui-layer">
    <!-- Game Info -->
    <div id="game-info">
      <div class="stat-display">ラウンド: <span id="round">1</span></div>
      <div class="stat-display">HP: <span id="hp">100</span> / 100</div>
      <div class="stat-display">金: <span id="gold">0</span></div>
    </div>

    <!-- Status Text -->
    <div id="status-text">スキルを選択してください</div>
  </div>

  <!-- Skill Panel -->
  <div id="skill-panel">
    <h2>スキルを選択</h2>
    <div id="skill-grid"></div>
  </div>

  <!-- Result Panel -->
  <div id="result-panel">
    <div id="result-icon"></div>
    <h3 id="result-title">スキル名</h3>
    <p id="result-message">結果メッセージ</p>
    <button class="result-button" onclick="nextRound()">次へ</button>
  </div>

  <!-- Title Screen -->
  <div id="title-screen">
    <h1>🪙 コイントスローグライク</h1>
    <p>コインをトスしてスキルを発動！<br>敵とのバトルで生き延びよう</p>
    <button id="start-button" onclick="startGame()">ゲーム開始</button>
  </div>

  <!-- Game Over Screen -->
  <div id="gameover-screen">
    <h2>ゲームオーバー</h2>
    <div class="stats-display">
      <p>到達ラウンド: <span id="final-round">1</span></p>
      <p>獲得ゴールド: <span id="final-gold">0</span></p>
      <p>与えたダメージ: <span id="final-damage">0</span></p>
    </div>
    <button id="retry-button" onclick="backToTitle()">タイトルに戻る</button>
  </div>

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cannon@0.20.0/build/cannon.js"></script>

  <!-- Scripts -->
  <script src="physics.js"></script>
  <script src="skills.js"></script>
  <script src="game.js"></script>
</body>
</html>
